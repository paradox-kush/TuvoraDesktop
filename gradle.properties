#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
# 12G matches the NuvioMobile twin (its iOS Release link needs it; desktop builds use far less —
# the cap is a ceiling, not a reservation). G1PeriodicGCInterval makes the idle daemon return heap
# to the OS ~5 min after a build instead of squatting at peak RSS for hours (measured 2026-08-15).
org.gradle.jvmargs=-Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:G1PeriodicGCInterval=300000 -XX:-G1PeriodicGCInvokesConcurrent
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
