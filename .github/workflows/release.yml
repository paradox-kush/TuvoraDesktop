name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Derive version from tag or input
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="${{ inputs.version }}"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch macOS libmpv runtime (LFS, arch-only)
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/**" --exclude=""

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are required — releases without them ship a broken login." >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
            echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
            echo "SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET}"
            echo "DONATIONS_DONATE_URL=${DONATIONS_DONATE_URL}"
          } > local.properties
          echo "keys written to local.properties:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/  \1/p' local.properties | sort
          for k in SIMKL_CLIENT_ID SIMKL_CLIENT_SECRET TRAKT_CLIENT_ID DONATIONS_DONATE_URL; do
            v=$(sed -n "s/^$k=//p" local.properties | head -1); echo "  $k length=${#v}"
          done

      - name: Build DMG (unsigned)
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew \
            :composeApp:packageReleaseDmg \
            "-Pnuvio.macos.arch=${MACOS_ARCH}" \
            "-Pnuvio.desktop.versionName=${RELEASE_VERSION}" \
            "-Pnuvio.desktop.versionCode=${GITHUB_RUN_NUMBER}" \
            "-PversionNameOverride=${RELEASE_VERSION}" \
            "-PversionCodeOverride=${GITHUB_RUN_NUMBER}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Verify DMG
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Tuvora-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          if [[ ! -f "${dmg_path}" ]]; then
            echo "Expected DMG was not produced: ${dmg_path}" >&2
            ls -la composeApp/build/compose/release-dmgs/ composeApp/build/compose/binaries/main-release/dmg/ 2>/dev/null
            exit 1
          fi
          hdiutil verify "${dmg_path}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: tuvora-desktop-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          path: composeApp/build/compose/release-dmgs/Tuvora-macOS-${{ matrix.arch }}-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 DEB
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || {
            echo "SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are required" >&2
            exit 1
          }
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
            echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
            echo "SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET}"
            echo "DONATIONS_DONATE_URL=${DONATIONS_DONATE_URL}"
          } > local.properties

      - name: Build DEB
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew \
            :composeApp:packageReleaseDeb \
            "-Pnuvio.desktop.versionName=${RELEASE_VERSION}" \
            "-Pnuvio.desktop.versionCode=${GITHUB_RUN_NUMBER}" \
            "-PversionNameOverride=${RELEASE_VERSION}" \
            "-PversionCodeOverride=${GITHUB_RUN_NUMBER}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace
          deb_path="$(find composeApp/build/compose/binaries/main-release/deb -name '*.deb' -print -quit)"
          test -n "$deb_path" && test -f "$deb_path"
          cp "$deb_path" "Tuvora-Linux-x64-${RELEASE_VERSION}.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: tuvora-desktop-${{ needs.version.outputs.version }}-linux-x64
          path: Tuvora-Linux-x64-${{ needs.version.outputs.version }}.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 MSI
    needs: version
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      TORRSERVER_WINDOWS_SHA256: 13031185a54abe0f729f9f3bdb7271a349a89ac8c559327d773c66007ed604f4
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch Windows runtime (LFS)
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi
          torrserver_path="composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe"
          torrserver_sha256="$(sha256sum "${torrserver_path}" | awk '{print $1}')"
          if [[ "${torrserver_sha256}" != "${TORRSERVER_WINDOWS_SHA256}" ]]; then
            echo "The bundled Windows TorrServer executable checksum does not match." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime keys
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are required — releases without them ship a broken login." >&2
            exit 1
          fi
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
            echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
            echo "SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET}"
            echo "DONATIONS_DONATE_URL=${DONATIONS_DONATE_URL}"
          } > local.properties
          echo "keys written to local.properties:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/  \1/p' local.properties | sort
          for k in SIMKL_CLIENT_ID SIMKL_CLIENT_SECRET TRAKT_CLIENT_ID DONATIONS_DONATE_URL; do
            v=$(sed -n "s/^$k=//p" local.properties | head -1); echo "  $k length=${#v}"
          done

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pnuvio.desktop.versionName=$env:RELEASE_VERSION" `
            "-Pnuvio.desktop.versionCode=$env:GITHUB_RUN_NUMBER" `
            "-PversionNameOverride=$env:RELEASE_VERSION" `
            "-PversionCodeOverride=$env:GITHUB_RUN_NUMBER" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Verify MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $msiRelativePath = "composeApp\build\compose\release-msis\Tuvora-Windows-x64-$env:RELEASE_VERSION.msi"
          if (-not (Test-Path $msiRelativePath)) {
            throw "Expected MSI was not produced: $msiRelativePath"
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: tuvora-desktop-${{ needs.version.outputs.version }}-windows-x64
          path: composeApp\build\compose\release-msis\Tuvora-Windows-x64-${{ needs.version.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la dist/
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tuvora Desktop ${VERSION}" \
            --generate-notes \
            --notes "**Windows note:** builds are not code-signed, so SmartScreen shows a blue
          \"Windows protected your PC\" box the first time you run the installer, and Defender may
          call it unrecognised. That is a warning about an unknown publisher, not a detected threat.
          Click **More info**, then **Run anyway**.

          **macOS note:** builds are unsigned — if macOS reports the app as damaged, run:
          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/Tuvora.app\"
          codesign --force --deep --sign - \"/Applications/Tuvora.app\"
          \`\`\`" \
            dist/Tuvora-macOS-arm64-${VERSION}.dmg \
            dist/Tuvora-macOS-x86_64-${VERSION}.dmg \
            dist/Tuvora-Linux-x64-${VERSION}.deb \
            dist/Tuvora-Windows-x64-${VERSION}.msi
