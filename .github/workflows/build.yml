name: Build

# Compiles the desktop JVM target and runs the desktop unit tests ON DEMAND ONLY
# (Actions tab -> Run workflow). Deliberately NOT run on every push to main or on PRs — that
# burned CI minutes on every commit; release builds are owned by release.yml (tag push).
# Run this by hand when you want a pre-release compile/test check.
on:
  workflow_dispatch:
    inputs:
      linux_packages:
        description: Also build the Linux DEB + AppImage (the release packaging path, ~15 min)
        type: boolean
        default: false
      native_bridges:
        description: Compile the native player bridges only (Linux .so on ubuntu, Windows .dll on windows-2022) - the fast check after touching native/*/player_bridge.*
        type: boolean
        default: false
      windows_tls:
        description: Compile Windows bridge and test packaged HTTPS trust with the shipped libmpv only
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Compile + test (desktop JVM)
    if: ${{ !inputs.windows_tls }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      # The vendored ComposeMediaPlayer builds its GStreamer natives (composeMediaPlayer:buildNativeLinux) as part of the
      # desktop compile; a bare runner has no GStreamer dev packages ("Package 'gstreamer-1.0' ... not found").
      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
            echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
            echo "SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET}"
            echo "MDBLIST_CLIENT_ID=${MDBLIST_CLIENT_ID}"
            echo "DONATIONS_DONATE_URL=${DONATIONS_DONATE_URL}"
          } > local.properties

      - name: Compile desktop + run tests
        run: ./gradlew :composeApp:compileKotlinDesktop :composeApp:desktopTest --stacktrace

  linux-packages:
    name: Package Linux (DEB + AppImage)
    if: inputs.linux_packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure runtime keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}"
            echo "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
            echo "SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}"
            echo "SIMKL_CLIENT_SECRET=${SIMKL_CLIENT_SECRET}"
            echo "MDBLIST_CLIENT_ID=${MDBLIST_CLIENT_ID}"
            echo "DONATIONS_DONATE_URL=${DONATIONS_DONATE_URL}"
          } > local.properties

      - name: Build DEB + AppImage
        run: bash ./scripts/linux/ci-package-linux.sh "0.0.${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_NUMBER}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: tuvora-desktop-ci-${{ github.run_number }}-linux-x86_64
          path: |
            Tuvora-Linux-x86_64-*.deb
            Tuvora-Linux-x86_64-*.AppImage
          if-no-files-found: error
          retention-days: 7

  linux-bridge:
    name: Native player bridge (Linux)
    if: inputs.native_bridges
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write empty local.properties
        run: touch local.properties

      - name: Compile + link the Linux player bridge
        run: |
          ./gradlew :composeApp:buildLinuxPlayerBridge --no-daemon --stacktrace
          bridge="$(find composeApp/build -name 'libplayer_bridge*.so' | head -1)"
          test -n "${bridge}" || { echo "libplayer_bridge.so was not produced" >&2; exit 1; }
          nm -D --defined-only "${bridge}" | grep "NativePlayerBridge_setTlsVerifyForNextCreate" \
            || { echo "setTlsVerifyForNextCreate is not exported" >&2; exit 1; }

  windows-bridge:
    name: Native player bridge (Windows)
    if: inputs.native_bridges || inputs.windows_tls
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write empty local.properties
        shell: bash
        run: touch local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2Loader.dll.lib was not found under $webView2Root"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile + link the Windows player bridge
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:buildWindowsPlayerBridge "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-ChildItem -Recurse -Path composeApp\build -Filter "player_bridge*.dll" | Select-Object -First 1
          if (-not $dll) { throw "the Windows player bridge DLL was not produced" }
          Write-Host "built $($dll.FullName) ($($dll.Length) bytes)"
          # JNI exports live in the export table as plain ASCII names; no dumpbin needed on the runner PATH.
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          if ($text -notmatch "Java_com_nuvio_app_features_player_desktop_NativePlayerBridge_setTlsVerifyForNextCreate") { throw "setTlsVerifyForNextCreate is not exported by the Windows bridge" }
          Write-Host "setTlsVerifyForNextCreate is exported"

      - name: Fetch shipped libmpv for TLS regression
        if: inputs.windows_tls
        shell: bash
        run: git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""

      - name: Prepare and test Windows playback trust
        if: inputs.windows_tls
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:prepareWindowsPlayerRuntime :composeApp:generateWindowsPlayerRuntimeIndex "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw "MSVC environment was not found" }
          $source = Join-Path $PWD 'composeApp\src\desktopMain\native\windows\tests\tls_smoke.cpp'
          $exe = Join-Path $env:RUNNER_TEMP 'tls_smoke.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'tls_smoke.obj'
          $bat = Join-Path $env:RUNNER_TEMP 'compile-tls-smoke.bat'
          @(
            '@echo off',
            ('call "{0}" >nul' -f $vcvars),
            'if errorlevel 1 exit /b %errorlevel%',
            ('cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /permissive- "{0}" /I"{1}\include" /I"{1}\include\win32" /I"{2}\build\native\include" /Fo"{3}" /Fe"{4}" /link "{2}\build\native\x64\WebView2Loader.dll.lib" Ole32.lib User32.lib Gdi32.lib Dwmapi.lib Shell32.lib' -f $source, $env:JAVA_HOME, $env:WEBVIEW2_ROOT, $obj, $exe),
            'exit /b %ERRORLEVEL%'
          ) | Set-Content -LiteralPath $bat -Encoding ASCII
          & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows/test-player-tls.py --exe "$exe" --runtime composeApp/build/native/windows-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
